appId: com.chenzhiyong.opencode-dashboard
productName: OpenCode Dashboard
copyright: Copyright © 2026 Chenzy

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  # Template tray artwork must keep its file names (macOS treats "…Template" and
  # the matching @2x file specially), so copy it next to the app resources as-is.
  - from: resources
    to: .

asar: true

afterPack: scripts/after-pack.cjs

mac:
  target:
    - target: dir
      arch: [x64]
  category: public.app-category.utilities
  icon: build/icon.icns
  # Ad-hoc signature (`-`), not a Developer ID: no Apple account, no
  # notarization. Unsigned Electron bundles crash their GPU/renderer children on
  # macOS 14 (SIGTRAP in ElectronMain), and login items silently fail, so this
  # is the minimum needed for a locally built app to run reliably.
  identity: '-'
  hardenedRuntime: false
  notarize: false
  extendInfo:
    LSUIElement: true
    LSMinimumSystemVersion: "13.0"
